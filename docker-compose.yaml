services:

  postgres:
    #image: postgres
    image: timescale/timescaledb:latest-pg15
    container_name: disti-postgres
    restart: always
    env_file:
      - disti.env
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      disti-network:
        ipv4_address: 172.16.238.11

  mqtt:
    image: disti-mosquitto
    build:
      context: ./mosquitto
    container_name: disti-mqtt
    restart: unless-stopped
    env_file:
      - disti.env
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      disti-network:
        ipv4_address: 172.16.238.12

  api:
    image: disti-backend
    container_name: disti-api
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - mqtt
      - postgres
    ports:
      - "5000:5000"
    env_file:
      - disti.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      disti-network:
        ipv4_address: 172.16.238.13

  hardware-agent:
    container_name: disti-hardware-agent
    image: disti-backend
    build:
      context: ./backend
    command: ["python", "-m", "entrypoints.hardware_agent"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
    env_file:
      - disti.env
    environment:
      DISTI_HARDWARE_MODE: raspberry
    devices:
      - /dev/i2c-1:/dev/i2c-1
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      disti-network:
        ipv4_address: 172.16.238.19

  watchdog:
    container_name: disti-watchdog
    build:
      context: ./watchdog
    restart: unless-stopped
    depends_on:
      - api
      - postgres
      - hardware-agent
    env_file:
      - disti.env
    environment:
      WATCHDOG_BACKEND_CONTAINER: disti-api
      WATCHDOG_DATABASE_CONTAINER: disti-postgres
      WATCHDOG_HARDWARE_CONTAINER: disti-hardware-agent
      WATCHDOG_BACKEND_HEALTH_URL: http://api:5000/healthz
      WATCHDOG_STATUS_URL: http://api:5000/watchdog/status
    volumes:
      # Required for VENTI-parity targeted restarts; grants host-level Docker control.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      disti-network:

  grafana:
    container_name: disti-grafana
    image: grafana/grafana:13.2.1
    restart: unless-stopped
    env_file:
      - disti.env
    ports:
      - '3000:3000'
    volumes:
      - ./grafana/:/etc/grafana
    networks:
      disti-network:
        ipv4_address: 172.16.238.18


  nginx:
    image: nginx:alpine
    container_name: disti-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
       - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      disti-network:
        ipv4_address: 172.16.238.10

networks:
  disti-network:
    name: disti-network
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400
    ipam:
      driver: default
      config:
        - subnet: 172.16.238.0/24

volumes:
  db_data:
