services:

  postgres:
    #image: postgres
    image: timescale/timescaledb:latest-pg15
    container_name: disti-postgres
    restart: always
    env_file:
      - ${DISTI_ENV_FILE:-disti.env}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      example-network:  
        ipv4_address: 172.16.238.11
  
  mqtt:
    image: disti-mosquitto
    build:
      context: ./mosquitto
    container_name: mqtt-broker
    restart: unless-stopped
    env_file:
      - ${DISTI_ENV_FILE:-disti.env}
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      example-network:  
        ipv4_address: 172.16.238.12
        
  backend:
    image: disti-backend
    container_name: flask-backend
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - mqtt
      - postgres
    ports:
      - "5000:5000"
    env_file:
      - ${DISTI_ENV_FILE:-disti.env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      example-network:
        ipv4_address: 172.16.238.13

  hardware-agent:
    container_name: disti-hardware-agent
    image: disti-backend
    build:
      context: ./backend
    command: ["python", "hardware_agent.py"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
    env_file:
      - ${DISTI_ENV_FILE:-disti.env}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      example-network:
        ipv4_address: 172.16.238.19

  watchdog:
    container_name: disti-watchdog
    build:
      context: ./watchdog
    restart: unless-stopped
    depends_on:
      - backend
      - postgres
      - hardware-agent
    env_file:
      - ${DISTI_ENV_FILE:-disti.env}
    environment:
      WATCHDOG_BACKEND_CONTAINER: flask-backend
      WATCHDOG_DATABASE_CONTAINER: disti-postgres
      WATCHDOG_HARDWARE_CONTAINER: disti-hardware-agent
      WATCHDOG_BACKEND_HEALTH_URL: http://backend:5000/healthz
      WATCHDOG_STATUS_URL: http://backend:5000/watchdog/status
      DISTI_HARDWARE_HEALTH_URL: http://hardware-agent:8081
    volumes:
      # Required for VENTI-parity targeted restarts; grants host-level Docker control.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      example-network:

  grafana:
    image: grafana/grafana:9.2.3
    restart: unless-stopped
    env_file:
      - ${DISTI_ENV_FILE:-disti.env}
    # depends_on:
    #   - influxdb
    ports:
      - '3000:3000'
    volumes:
      - ./grafana/:/etc/grafana
      - ./grafana/plugins/:/var/lib/grafana/plugins
    networks:
      example-network:
        ipv4_address: 172.16.238.18
        
        
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
       - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      example-network:
        ipv4_address: 172.16.238.10

networks:
  example-network:
    name: example-network
    driver: bridge
    ipam:
      driver: default
      config: 
        - subnet: 172.16.238.0/24

volumes:
  db_data:
